[pytest]
pythonpath = docs/backend/projects/world_model/open_world_model/src
testpaths =
    docs/backend/projects/world_model/open_world_model/tests
    tests
markers =
    private_evidence: needs withheld private evidence
    gpu: needs CUDA device
    real_data: needs admitted real source
addopts =
    -m "not gpu and not real_data and not private_evidence"
    --deselect=docs/backend/projects/world_model/open_world_model/tests/test_release_state_dataset.py::TestUnitBoundary::test_the_source_really_is_feet_not_metres
    --deselect=docs/backend/projects/world_model/open_world_model/tests/test_release_state_dataset.py::TestUnitBoundary::test_the_same_boundary_applies_to_ball_body_and_hands
    --deselect=docs/backend/projects/world_model/open_world_model/tests/test_release_state_dataset.py::TestUnitBoundary::test_timestamps_are_never_scaled
    --deselect=docs/backend/projects/world_model/open_world_model/tests/test_release_state_dataset.py::TestElapsedTimeContract::test_adding_one_sample_does_not_fix_the_real_corpus
    --deselect=docs/backend/projects/world_model/open_world_model/tests/test_release_state_dataset.py::TestElapsedTimeContract::test_an_unknown_selection_rule_is_refused_not_guessed
    --deselect=docs/backend/projects/world_model/open_world_model/tests/test_release_state_dataset.py::TestElapsedTimeContract::test_a_config_without_a_selection_key_keeps_the_legacy_rule
    --deselect=docs/backend/projects/world_model/open_world_model/tests/test_release_state_dataset.py::TestFrozenFeatureSchema::test_the_real_corpus_schema_is_identical_in_every_trial
    --deselect=docs/backend/projects/world_model/open_world_model/tests/test_release_stratum.py::test_trial_filenames_are_not_unique_across_sessions
    --deselect=docs/backend/projects/world_model/open_world_model/tests/test_release_stratum.py::test_the_example_identity_carries_the_session
